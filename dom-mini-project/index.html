<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f0f0;
    font-family: sans-serif;
  }

  .toggle {
    position: relative;
    width: 70px;
    height: 35px;
  }

  .toggle input {
    display: none;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ccc;
    border-radius: 35px;
    transition: 0.3s;
  }

  .slider::before {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    left: 4px;
    top: 3.5px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }

  input:checked + .slider {
    background: #4caf50;
  }

  input:checked + .slider::before {
    transform: translateX(35px);
  }
</style>
</head>
<body>

<label class="toggle">
  <input type="checkbox">
  <span class="slider"></span>
</label>

</body>
</html>
